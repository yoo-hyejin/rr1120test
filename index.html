<!DOCTYPE html>
<html lang="ko">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 체크박스 커스텀 */
        .compare-checkbox:checked + div {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        
        /* 인포그래픽 타임라인 선 */
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #bfdbfe;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .timeline-line::before {
                left: 24px;
            }
        }
    </style>
</head>
<body class="min-h-screen relative pb-20">

        // 1. 카드 렌더링

            // 체크박스 SVG 토글 로직 추가
            document.querySelectorAll('.compare-checkbox').forEach(cb => {
                cb.addEventListener('change', function() {
                    const svg = this.nextElementSibling.querySelector('svg');
                    if(this.checked) svg.classList.remove('opacity-0');
                    else svg.classList.add('opacity-0');
                });

        // 2. 선택 처리 로직
        function handleSelect(checkbox) {
            if (checkbox.checked) {
                if (selectedJobs.length >= 2) {
                    alert("비교는 최대 2개까지만 가능합니다.");
                    checkbox.checked = false;
                    checkbox.nextElementSibling.querySelector('svg').classList.add('opacity-0');
                    return;
                }
                selectedJobs.push(checkbox.value);
            } else {
                selectedJobs = selectedJobs.filter(id => id !== checkbox.value);
            }
            updateCompareButton();
        }

        function updateCompareButton() {
            const btn = document.getElementById('compareBtn');
            document.getElementById('selectCount').innerText = selectedJobs.length;
            
            if (selectedJobs.length === 2) {
                btn.className = "bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold transition-all duration-300 shadow-md";
                btn.disabled = false;
                btn.onclick = openCompare;
            } else {
                btn.className = "bg-slate-200 text-slate-500 px-6 py-2 rounded-xl font-bold transition-all duration-300 cursor-not-allowed";
                btn.disabled = true;
                btn.onclick = null;
            }
        }

        // 3. 상세 정보 모달 열기

        // 4. 비교 모달 열기 및 분석
        function openCompare() {
            const job1 = jobData.find(j => j.id === selectedJobs[0]);
            const job2 = jobData.find(j => j.id === selectedJobs[1]);
            
            const content = document.getElementById('compareContent');
            content.innerHTML = renderCompareCard(job1) + renderCompareCard(job2);

        // 6. 대학 정보 모달 열기
        function showUniv(majorName) {
            document.getElementById('univModalTitle').innerText = majorName;
            
            const univList = majorUnivMap[majorName] || ['정보 없음'];
            const content = document.getElementById('univModalContent');
            
            content.innerHTML = univList.map(univ => 
                `<span class="px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-100 rounded-lg text-sm">${univ}</span>`
            ).join('');
            
            document.getElementById('univModal').classList.remove('hidden');
        }

        // 5. 로드맵 (인포그래픽) 열기
        function openRoadmap(jobId) {
            const job = jobData.find(j => j.id === jobId);
            
            // 모달 전환
            closeModal('detailModal');
            
            document.getElementById('roadmapJobName').innerText = job.title;
            const timeline = document.getElementById('roadmapTimeline');
            timeline.innerHTML = '';

            const icons = ['🎒', '🎓', '📝', '💼'];

            job.roadmap.forEach((item, index) => {
                const isLeft = index % 2 === 0;
                
                // 데스크톱: 지그재그, 모바일: 왼쪽 정렬
                const alignClass = isLeft ? 'md:justify-start' : 'md:justify-end';
                const cardMargin = isLeft ? 'md:mr-12' : 'md:ml-12';
                const textAlign = isLeft ? 'md:text-right' : 'md:text-left';
                const dotPosition = isLeft ? 'md:-right-[22px]' : 'md:-left-[22px]';

                const html = `
                    <div class="relative w-full flex justify-start ${alignClass} mb-12 last:mb-0">
                        <!-- 데스크톱 중앙 점 / 모바일 왼쪽 점 -->
                        <div class="absolute left-[24px] md:left-1/2 transform -translate-x-1/2 w-4 h-4 rounded-full bg-blue-600 border-4 border-white shadow z-10 top-6"></div>
                        
                        <!-- 콘텐츠 카드 -->
                        <div class="w-full pl-[60px] md:pl-0 md:w-5/12">
                            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 hover:shadow-lg transition-shadow relative">
                                <!-- 데스크톱 연결 선 화살표 (선택사항, CSS로 처리하기 복잡하므로 생략하거나 심플하게 유지) -->
                                <div class="text-blue-500 font-bold text-sm mb-1">${item.step} ${icons[index]}</div>
                                <h4 class="text-xl font-bold text-slate-800 mb-2">${item.title}</h4>
                                <p class="text-slate-600 leading-relaxed text-sm">${item.desc}</p>
                            </div>
                        </div>
                    </div>
                `;
                timeline.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('roadmapModal').classList.remove('hidden');
        }

        // 공통: 모달 닫기
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // ESC 키 누르면 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('detailModal');
                closeModal('compareModal');
                closeModal('roadmapModal');
                closeModal('univModal');
            }
        });
    </script>
</body>
</html>
